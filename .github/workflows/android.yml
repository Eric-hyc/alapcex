name: Lapce Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "lapce-android -> target"

      # lapce 源码不进仓库：每次现场 clone，再把它的 floem 依赖重定向到本仓库
      # 已适配的 floem / floem-editor-core，并剔除 rfd-async-std feature。
      - name: Vendor Lapce and repoint floem
        run: |
          git clone --depth 1 https://gitee.com/mirrors/lapce.git lapce
          python3 - <<'PY'
import re
p = 'lapce/Cargo.toml'
s = open(p).read()
s = re.sub(
    r'\[workspace\.dependencies\.floem\]\n# path = "[^"]*"\ngit = "https://github\.com/lapce/floem"\nrev = "[^"]+"\n',
    '[workspace.dependencies.floem]\npath = "../floem"\n', s)
s = re.sub(
    r'\[workspace\.dependencies\.floem-editor-core\]\n# path = "[^"]*"\ngit = "https://github\.com/lapce/floem"\nrev = "[^"]+"\n',
    '[workspace.dependencies.floem-editor-core]\npath = "../floem/editor-core"\n', s)
s = s.replace(', "rfd-async-std"', '')
open(p, 'w').write(s)
print("=== patched floem/rfd lines ===")
for line in open(p):
    if 'floem' in line or 'rfd' in line:
        print(line, end='')
PY

      - name: Build Lapce Android .so
        working-directory: ./lapce-android
        run: cargo ndk -t arm64-v8a build --release

      - name: Verify the .so
        run: |
          set -euo pipefail
          found="$(find lapce-android/target -name 'liblapce_android.so' -type f | head -n 1)"
          [ -n "$found" ] || { echo "::error::liblapce_android.so not produced"; exit 1; }
          file "$found"
          readelf -h "$found" | grep -E 'Class|Machine'

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapce-android-so
          path: lapce-android/target/*/release/liblapce_android.so
          if-no-files-found: error