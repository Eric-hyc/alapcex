name: Lapce Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "lapce-android -> target"

      # lapce 源码不进仓库：每次现场 clone，再用脚本把它的 floem 依赖
      # 重定向到本仓库已适配的 floem / floem-editor-core，并剔除 rfd feature。
      - name: Vendor Lapce and repoint floem
        run: |
          git clone --depth 1 https://gitee.com/mirrors/lapce.git lapce
          python3 scripts/patch_lapce.py

      - name: Build Lapce Android .so
        working-directory: ./lapce-android
        run: cargo ndk -t arm64-v8a build --release

      - name: Verify the .so
        run: |
          set -euo pipefail
          found="$(find lapce-android/target -name 'liblapce_android.so' -type f | head -n 1)"
          [ -n "$found" ] || { echo "::error::liblapce_android.so not produced"; exit 1; }
          file "$found"
          readelf -h "$found" | grep -E 'Class|Machine'

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapce-android-so
          path: lapce-android/target/*/release/liblapce_android.so
          if-no-files-found: error

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.9/bin >> "$GITHUB_PATH"

      - name: Assemble APK
        run: |
          set -euo pipefail
          mkdir -p android-shell/app/src/main/jniLibs/arm64-v8a
          cp lapce-android/target/*/release/liblapce_android.so android-shell/app/src/main/jniLibs/arm64-v8a/
          sed -i 's/floem_android_demo/lapce_android/g' android-shell/app/src/main/AndroidManifest.xml
          gradle -p android-shell assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapce-android-apk
          path: android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error