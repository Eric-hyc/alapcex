name: Android Rust Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "floem -> target"

      # `-p` is required: the `examples/*` glob in default-members does not
      # select example packages, so the cdylib was never built.
      - name: Build with cargo-ndk
        working-directory: ./floem
        run: cargo ndk -t arm64-v8a build --release --no-default-features -p floem-android-demo

      - name: Locate the Android .so
        run: |
          set -euo pipefail
          mkdir -p dist
          found="$(find floem/target -name 'libfloem_android_demo.so' -type f | head -n 1)"
          if [ -z "$found" ]; then
            echo "::error::libfloem_android_demo.so was not produced"
            ls -la floem/target/*/release/ || true
            exit 1
          fi
          cp "$found" dist/
          file dist/libfloem_android_demo.so
          readelf -h dist/libfloem_android_demo.so | grep -E 'Class|Machine'

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: floem-android-so
          path: dist/*.so
          if-no-files-found: error

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.9/bin >> "$GITHUB_PATH"

      - name: Assemble APK
        run: |
          set -euo pipefail
          mkdir -p android-shell/app/src/main/jniLibs/arm64-v8a
          cp dist/libfloem_android_demo.so android-shell/app/src/main/jniLibs/arm64-v8a/
          gradle -p android-shell assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floem-android-apk
          path: android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
