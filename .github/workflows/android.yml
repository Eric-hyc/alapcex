name: Android Rust Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "floem -> target"

      # `-p` is required: the `examples/*` glob in default-members does not
      # select example packages, so the cdylib was never built.
      - name: Build with cargo-ndk
        working-directory: ./floem
        run: cargo ndk -t arm64-v8a build --release --no-default-features -p floem-android-demo

      # find is unambiguous: a missing .so fails here with a real message
      # instead of relying on glob expansion behaviour.
      - name: Locate the Android .so
        run: |
          set -euo pipefail
          mkdir -p dist
          found="$(find floem/target -name 'libfloem_android_demo.so' -type f | head -n 1)"
          if [ -z "$found" ]; then
            echo "::error::libfloem_android_demo.so was not produced"
            echo "--- release dir contents ---"
            ls -la floem/target/*/release/ || true
            exit 1
          fi
          cp "$found" dist/
          file dist/libfloem_android_demo.so
          readelf -h dist/libfloem_android_demo.so | grep -E 'Class|Machine'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floem-android-so
          path: dist/*.so
          if-no-files-found: error
