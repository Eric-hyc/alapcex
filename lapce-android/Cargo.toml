[package]
name = "lapce-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "lapce_android"
crate-type = ["cdylib"]

[dependencies]
floem = { path = "../floem", features = ["editor", "serde", "default-image-formats"] }
lapce-core = { path = "../lapce/lapce-core" }
# The real Lapce UI lives here; pulling it in now to surface all Android
# compile issues in one go.
lapce-app = { path = "../lapce/lapce-app" }