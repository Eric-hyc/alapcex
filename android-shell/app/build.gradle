plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.hyc.floemshell'
    compileSdk 35

    defaultConfig {
        applicationId "dev.hyc.floemshell"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // 只打 arm64：.so 本身就是 aarch64
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // 纯原生：没有任何 Java/Kotlin 源码
    sourceSets {
        main {
            java.srcDirs = []
        }
    }
}
